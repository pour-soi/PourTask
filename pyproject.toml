[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "PourTask"
version = "0.1.0"
description = "A calm, local-first Windows task manager"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["PySide6>=6.6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "PyInstaller>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
